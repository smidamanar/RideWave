name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: RideWave/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: RideWave

      - name: Prepare application environment
        run: cp .env.example .env && php artisan key:generate
        working-directory: RideWave

      - name: Install JavaScript dependencies
        run: npm ci
        working-directory: RideWave

      - name: Build frontend assets
        run: npm run build
        working-directory: RideWave

      - name: Check PHP formatting
        run: vendor/bin/pint --test app bootstrap/app.php bootstrap/providers.php config database lang public/index.php routes tests
        working-directory: RideWave

      - name: Run tests
        run: php artisan test
        working-directory: RideWave
